<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Makes Chrome on Linux see only the fonts bundled in this folder, with the
     system's font rendering rules. Use it with (run from src/):
       FONTCONFIG_FILE="$PWD/fonts/fonts.conf" ./render-v1.sh
     The output looks the same but may not be byte for byte the same as a build
     with the fonts installed. See src/README.md, "Fonts". -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">.fccache</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>

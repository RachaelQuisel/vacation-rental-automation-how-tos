<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Makes Chrome see only the fonts bundled in this folder.
     Use it with: FONTCONFIG_FILE="$PWD/fonts/fonts.conf" ./render-v1.sh  (run from src/) -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">.fccache</cachedir>
</fontconfig>
